name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the project's release signing certificate. A release signed with anything else fails.
  EXPECTED_CERT_SHA256: 9d40fbeb28168036d7ae2473432ca1fa9f18d2acc999a6fc76465b536d5b309e

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EXBLOAT_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret EXBLOAT_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build the release APK
        env:
          EXBLOAT_STORE_FILE: ${{ runner.temp }}/release.jks
          EXBLOAT_STORE_PASSWORD: ${{ secrets.EXBLOAT_STORE_PASSWORD }}
          EXBLOAT_KEY_ALIAS: ${{ secrets.EXBLOAT_KEY_ALIAS }}
          EXBLOAT_KEY_PASSWORD: ${{ secrets.EXBLOAT_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" | tee signer.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" signer.txt \
            || { echo "::error::Release APK is not signed with the project key"; exit 1; }

      - name: Package the release files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ExBloatTV-$VERSION.apk"
          cp cli/exbloattv "out/exbloattv-cli-$VERSION.sh"
          git archive --format=zip --prefix="exbloattv-$VERSION/" -o "out/exbloattv-$VERSION-source.zip" HEAD
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Release notes: this version's CHANGELOG section plus the checksums.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "### Verify your download"
            echo
            echo "Signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`"
            echo
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } >> notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "ExBloat TV $VERSION" \
            --notes-file notes.md \
            --verify-tag
